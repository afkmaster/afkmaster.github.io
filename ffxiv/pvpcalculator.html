<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="FFXIV PVP Malmstone XP Calculator">
    <meta property="og:description" content="A tool to help you calculate how many malmstones you need to reach a given PVP Malmstone Series Level goal.">
    <meta property="og:type" content="website">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/chota.css">
    <link rel="stylesheet" type="text/css" href="css/stylesheet.css">
    <title>FFXIV PVP Malmstone XP Calculator</title>
</head>
<body>
    <div class="container"></div>
    </div>
    <div class="container card">
        <!-- <label class="title">FFXIV PVP Malmstone XP Calculator</label> -->
        <header>
            <div class="row">
                <div class="col">
                    <h1>FFXIV PVP Malmstone XP Calculator</h1>
                </div>
                <div class="col-1">
                    <span class="is-right">
                    </span>
                </div>
            </div>

        </header>
        <div class="container inner">
            <div class="row">
                <div class="col">
                    <label for="currentLevel">Current Level </label>
                    <input type="number" class="input" id="currentLevel" placeholder="1-39" min="1" max="39">
                </div>
                <div class="col">
                    <label for="goalLevel">Goal Level </label>
                    <input type="number" class="input" id="goalLevel" placeholder="2-40" min="2" max="40">
                </div>
                <div class="col">
                    <label for="currentProgress">Current XP</label>
                    <input type="number" class="input" id="currentProgress" placeholder="0-19999" min="0" max="19999">
                </div>
            </div>            
            </p>
        </div>
        <footer class="is-center">
            <button type="button", class="button" onclick="calculateXP()">Calculate</button>
        </footer>
    </div>
    

    <div class="container card">
        <header>
            <h1>Output</h1>
        </header>
        <div class="container inner">
            <p id="firstTime">
                Please set your Current Level, Goal Level, and Current XP Towards Next Level, and then click CALCULATE to generate your results!
            </p>
            <div class="row summary" id="summary">
            </div>
            <div id="output" class="row summary">

                <div class="col">
                    <div class="row" id="cc"></div>
                    <div class="row" id="rw"></div>
                </div>
                <div class="col">
                    <div class="row" id="fl"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="container card">
        <header>
            <h1>ABOUT</h1>
        </header>
        <div class="container inner">
        </div>
    </div>

    <script src="js/script.js"></script>
    
</body>
</html>
